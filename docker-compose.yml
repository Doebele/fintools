services:
  portfolio-backend-v3:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: portfolio-backend-v3
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-3003}:3001"
    volumes:
      - ./data:/app/data
    extra_hosts:
      - "host.docker.internal:host-gateway"   # reach LM Studio/Ollama on the host (Linux/Synology)
    environment:
      TZ:              "${TZ:-Europe/Zurich}"
      NODE_ENV:        production
      PORT:            3001
      DATABASE_PATH:   /app/data/portfolio.db
      QUOTE_TTL_MIN:   "${QUOTE_TTL_MIN:-5}"
      FX_TTL_MIN:      "${FX_TTL_MIN:-60}"
      LOG_LEVEL:       "${LOG_LEVEL:-info}"
      RATE_LIMIT_MAX_REQUESTS: "${RATE_LIMIT_MAX_REQUESTS:-200}"
      AV_API_KEY: "${AV_API_KEY:-}"
      # Password-reset mails via one SMTP mailbox (values from the git-ignored .env,
      # see .env.example). Empty SMTP_HOST = no mail is sent.
      SMTP_HOST:     "${SMTP_HOST:-}"
      SMTP_PORT:     "${SMTP_PORT:-465}"
      SMTP_USER:     "${SMTP_USER:-}"
      SMTP_PASSWORD: "${SMTP_PASSWORD:-}"
      SMTP_FROM:     "${SMTP_FROM:-}"
      # Base for links in mails — fixed, never taken from the request's Host header
      APP_BASE_URL:  "${APP_BASE_URL:-http://localhost:3002}"
      # Passkeys are bound to the domain: rpID = bare host, origins = full URLs the app
      # is served from. Fixed per deployment, never taken from the request.
      WEBAUTHN_RP_ID:   "${WEBAUTHN_RP_ID:-localhost}"
      WEBAUTHN_ORIGINS: "${WEBAUTHN_ORIGINS:-http://localhost:3002}"
    networks:
      - portfolio-network-v3
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3001/api/health',(r)=>{process.exit(r.statusCode===200?0:1)})"]
      interval: 30s
      timeout:  5s
      retries:  3
      start_period: 60s   # the Strato VPS needs longer than 45s on a cold start

  portfolio-frontend-v3:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: portfolio-frontend-v3
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3002}:80"
    depends_on:
      portfolio-backend-v3:
        condition: service_healthy
    networks:
      - portfolio-network-v3
    healthcheck:
      # 127.0.0.1, not localhost: localhost resolves to ::1 and nginx listens on IPv4 only
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/"]
      interval: 30s
      timeout:  5s
      retries:  3

networks:
  portfolio-network-v3:
    driver: bridge
    name:   portfolio-network-v3
